<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>E09 - Entidades HTML</title>
</head>

<body>

    <!-- 1. Mostrar etiquetas HTML literalmente usando &lt; y &gt; -->
    <p>&lt;h1&gt;Título&lt;/h1&gt;</p>

    <!-- 2. Copyright con &copy; -->
    <p>&copy; 2026 Luis Castel Osuna</p>

    <!-- 3. Espacio de no separación (&nbsp;) y símbolo del euro (&euro;) -->
    <p>Precio del producto: 10&nbsp;&euro;</p>

    <!-- 4. Tres emojis usando entidades numéricas (hexadecimales o decimales) -->
    <p>Emojis: &#x1F680; &#x1F4BB; &#x2705;</p>
